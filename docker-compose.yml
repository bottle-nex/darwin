services:
  db:
    image: postgres:16
    container_name: nanbe-postgres
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=nanbe
    ports:
      - '5434:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: nanbe-redis
    ports:
      - '6370:6379'
    command: redis-server --appendonly yes --notify-keyspace-events Ex
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio:latest
    container_name: nanbe-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${SERVER_MINIO_ACCESS_KEY:-trymatcha-local}
      MINIO_ROOT_PASSWORD: ${SERVER_MINIO_SECRET_KEY:-trymatcha-local-dev-only}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 2s
      timeout: 2s
      retries: 20

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${SERVER_MINIO_ACCESS_KEY:-trymatcha-local}
      MINIO_ROOT_PASSWORD: ${SERVER_MINIO_SECRET_KEY:-trymatcha-local-dev-only}
      SERVER_PRODUCT_DIFF_BUCKET: ${SERVER_PRODUCT_DIFF_BUCKET:-product-diffs}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing local/$${SERVER_PRODUCT_DIFF_BUCKET}
      "

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local
