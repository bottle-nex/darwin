services:
  db:
    image: postgres:16
    container_name: nanbe-postgres
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=nanbe
    ports:
      - '127.0.0.1:4403:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: nanbe-redis
    ports:
      - '127.0.0.1:4404:6379'
    command: redis-server --appendonly yes --notify-keyspace-events Ex
    volumes:
      - redis_data:/data

  minio:
    image: quay.io/minio/minio:latest
    container_name: nanbe-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-trydarwin-local}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-trydarwin-local-dev-only}
    ports:
      - "127.0.0.1:4405:9000"
      - "127.0.0.1:4406:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 2s
      timeout: 2s
      retries: 20

  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-trydarwin-local}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-trydarwin-local-dev-only}
      PRODUCT_DIFF_BUCKET: ${PRODUCT_DIFF_BUCKET:-product-diffs}
      RUN_LOGS_BUCKET: ${RUN_LOGS_BUCKET:-run-logs}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing local/$${PRODUCT_DIFF_BUCKET} &&
      mc mb --ignore-existing local/$${RUN_LOGS_BUCKET}
      "

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local
